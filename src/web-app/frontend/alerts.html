    <!-- Main Content Wrapper -->
    <div class="main-content">
        <section class="background">
            <video autoplay muted loop id="backgroundVideo">
                <source src="/static/videos/background_video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="overlay"></div>
        </section>

        <section class="alerts-container">
            <div class="alert-inner-wrapper">
                <div class="alerts-actions" style="text-align: right; margin-bottom: 15px;">
                    <button id="hideAlerts" class="action-btn">Hide Alerts</button>
                    <button id="removeAlerts" class="action-btn">Remove Alerts</button>
                    <button id="showHiddenAlerts" class="action-btn">Show Hidden</button>
                </div>

                <table class="alerts-table">
                    <thead>
                    <tr>
                        <th>Select</th>
                        <th>Alert No</th>
                        <th>Description</th>
                        <th>Level</th>
                        <th>Date & Time</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <style>
        .main-content {
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 90px 30px 30px;
            position: relative;
            z-index: 1;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        #backgroundVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }



        .alerts-container {
            display: flex;
            justify-content: center;
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.1); /* transparent background */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .alerts-table {
            width: 100%;
            max-width: 1200px;
            border-collapse: collapse;
            color: #fff;
            background: rgba(0, 0, 0, 0.3); /* semi-transparent table bg */
            border-radius: 10px;
            overflow: hidden;
        }

        .alerts-table th,
        .alerts-table td {
            padding: 14px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .alerts-table th {
            background-color: rgba(0, 0, 0, 0.6);
            font-weight: 600;
            color: #fff;
        }

        .alerts-table tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Alert levels stored in the database: critical, warning, info */
        .alert-level.critical {
            color: #ff4d4d;
            font-weight: bold;
        }

        .alert-level.warning {
            color: #ffc107;
            font-weight: bold;
        }

        .alert-level.info {
            color: #28a745;
            font-weight: bold;
        }

        .alert-checkbox {
            transform: scale(1.3);
            cursor: pointer;
            accent-color: #0dcaf0;
        }

        .alert-inner-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .alerts-actions {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .action-btn {
            background-color: #0dcaf0;
            border: none;
            color: #000;
            padding: 10px 18px;
            margin: 0 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .action-btn:hover {
            background-color: #0bb2d4;
        }

    </style>

    <script type="module" src="/static/js/alerts.js"></script>
