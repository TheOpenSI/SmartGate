networks:
  sgnet:
    driver: bridge

services:
  sgwebimage:
    build: . 
    ports:
      - "8000:8000"  # Expose web app on port 8000
    environment:
      - DATABASE_URL=postgresql://admin:smartgate@postgres:5432/smartgatedb
      # The values below come from the .env file next to this one (see .env.example)
      - ENV=${ENV:-development}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - JETSON_LIVE_URL=${JETSON_LIVE_URL:-}
      - JETSON_LIVE_SERVICE=${JETSON_LIVE_SERVICE:-}
      - JETSON_GATE_NO=${JETSON_GATE_NO:-}
      - JETSON_TOKEN=${JETSON_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Lets the container reach a Jetson service on this same machine (see JETSON_LIVE_URL)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pages, CSS and browser JS are shared with the container, so edits show on refresh.
    # Changes to app.js or controllers/ need: docker compose restart sgwebimage
    volumes:
      - ./frontend:/SmartGate/frontend:ro
      - ./wwwroot:/SmartGate/wwwroot:ro
    networks:
      - sgnet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:13 
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: smartgate
      POSTGRES_DB: smartgatedb
    volumes:
      - smartgate-data:/var/lib/postgresql/data
      - ./models/user_schema.sql:/docker-entrypoint-initdb.d/user_schema.sql
      - ./models/gate_schema.sql:/docker-entrypoint-initdb.d/gate_schema.sql
    networks:
      - sgnet
    ports:
      - "5432:5432"  # Expose PostgreSQL port 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smartgatedb -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  smartgate-data:
